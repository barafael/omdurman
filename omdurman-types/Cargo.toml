[package]
name = "omdurman-types"
description = "Shared foundational types: HexCoord, Terrain, Location, HexData"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Empty twin of `omdurman-rules`' proof-build feature: lets `cargo kani` runs
# that select both crates pass a single `--features kani`.
kani = []
# The expensive proof tier (`KANI_EXPENSIVE=1 ./run-kani.sh`): the sequencing
# proofs in `net_seq`, whose symbolic B-tree operations take tens of minutes.
kani-expensive = []

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_with = { workspace = true }
strum = { workspace = true }

# `#[rulebook]` on the Kani proofs (proof builds only) and on tests.
[target.'cfg(kani)'.dependencies]
traceability-macro = { path = "../traceability-macro" }

[dev-dependencies]
traceability-macro = { path = "../traceability-macro" }
