[workspace]
resolver = "2"

members = [
    "omdurman-types",
    "omdurman-hexmap",
    "omdurman-net",
    "omdurman-rules",
    "omdurman-app",
    "omdurman-bot",
    "tools/asset-editor",
    "tools/map-editor",
    "tools/traceability-typst",
    "tools/traceability-lsp",
    "traceability-macro",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# `cfg(kani)` is set by the Kani model checker (`cargo kani`), which is not a
# normal cargo feature -- register it so `unexpected_cfgs` stays quiet for the
# `#[cfg(kani)]` proof modules. See scripts/kani.sh.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
# `webp` added on top of default features so the asset server can decode the
# WebP map/unit/sprite textures (photo scans re-encoded lossily to shrink load).
bevy = { version = "0.19", features = ["webp"] }
bevy_egui = "0.41"
bevy_matchbox = { git = "https://github.com/barafael/matchbox.git", branch = "main" }
matchbox_socket = { git = "https://github.com/barafael/matchbox.git", branch = "main" }
matchbox_signaling = { git = "https://github.com/barafael/matchbox.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", features = ["indexmap_2"] }
ron = "0.8"
postcard = { version = "1", features = ["alloc"] }
rand = "0.10"
rand_chacha = "0.10"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
# `default-features = false`: only the codecs the tools/app need are enabled
# per crate (the app enables the defaults for the asset server; the asset
# editor adds webp/jpeg/png only).
image = { version = "0.25", default-features = false }
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
# egui is version-locked to whatever bevy_egui wraps (bevy_egui 0.41 -> egui
# 0.31); declaring it once here keeps the asset-editor's standalone egui in
# lockstep with the game's.
egui = "0.31"
eframe = "0.31"

toml = "0.8"
tracing = "0.1"

serde_json = "1"
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"

# Shared async/CLI deps used by more than one crate.
futures = "0.3"
dotenvy = "0.15"
petname = { version = "3", default-features = false, features = ["default-rng"] }
# Feature-less base declaration; dependent crates add the features they need
# (net: rt; bot: rt; net dev: macros/rt-multi-thread/time).
tokio = "1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# LTO is disabled: the current beta rustc drops `#[used]` linker statics
# (bevy_reflect's `inventory` REGISTRY, tracing `___CALLSITE`, winsock
# `WSA_STARTED`, ...) under both thin and fat LTO, which fails the MSVC link
# with unresolved externals. Re-enable once the toolchain regression is fixed.
lto = false

# The wasm-release profile: optimize for runtime speed on web (not size exclusively).
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize for speed. wasm-opt (data-wasm-opt="2" in index.html) also runs -O2 post-build.
opt-level = 2
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

# We depend on the barafael/matchbox fork (branch main). The message loop no
# longer panics (killing every connection of the socket) when an outgoing
# packet races a peer teardown; it drops the packet and logs instead. The
# network reliability harness (omdurman-net/tests/replay_reliability.rs)
# triggers this race routinely around rejoins.
