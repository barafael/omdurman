[package]
name = "omdurman"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18"
bevy_egui = "0.39"
bevy_matchbox = "0.14"
rand = "0.10"
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
postcard = { version = "1", features = ["alloc"] }
avian3d = "0.6"

# rand uses getrandom internally; the "js" feature makes it work in browsers.
# Bevy's ahash transitively pulls in getrandom 0.3, which needs the "wasm_js"
# feature plus a build cfg flag (set in .cargo/config.toml).
# web-sys is for reading the URL hash (room code).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
