[workspace]
resolver = "2"

members = [
    "omdurman-types",
    "omdurman-hexmap",
    "omdurman-net",
    "omdurman-rules",
    "omdurman-app",
    "tools/traceability-typst",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# `webp` added on top of default features so the asset server can decode the
# WebP map/unit/sprite textures (photo scans re-encoded lossily to shrink load).
bevy = { version = "0.18", features = ["webp"] }
bevy_egui = "0.39"
bevy_matchbox = "0.14"
avian3d = "0.6"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", features = ["indexmap_2"] }
ron = "0.8"
postcard = { version = "1", features = ["alloc"] }
rand = "0.10"
rand_chacha = "0.10"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
image = "0.25"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
bevy-color-palettes = "0.3.3-alpha.1"
toml = "0.8"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# LTO is disabled: the current beta rustc drops `#[used]` linker statics
# (bevy_reflect's `inventory` REGISTRY, tracing `___CALLSITE`, winsock
# `WSA_STARTED`, ...) under both thin and fat LTO, which fails the MSVC link
# with unresolved externals. Re-enable once the toolchain regression is fixed.
lto = false

# The wasm-release profile: optimize for runtime speed on web (not size exclusively).
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize for speed. wasm-opt (data-wasm-opt="2" in index.html) also runs -O2 post-build.
opt-level = 2
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"
