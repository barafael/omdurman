[package]
name    = "paper-strategy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy          = "0.18"
bevy_matchbox = "0.14"        # tracks Bevy 0.18
rand          = "0.8"
rand_chacha   = "0.3"
serde         = { version = "1", features = ["derive"] }
bincode       = "1"

# rand uses getrandom internally; the "js" feature makes it work in browsers.
# Bevy's ahash transitively pulls in getrandom 0.3, which needs the "wasm_js"
# feature plus a build cfg flag (set in .cargo/config.toml).
# web-sys is for reading the URL hash (room code).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom    = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
web-sys      = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
