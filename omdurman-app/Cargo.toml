[package]
name = "omdurman-app"
description = "Bevy frontend — rendering, editor tools, camera, dice physics, networking glue"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omdurman"
path = "src/main.rs"

[dependencies]
omdurman-types = { path = "../omdurman-types" }
omdurman-hexmap = { path = "../omdurman-hexmap" }
omdurman-net = { path = "../omdurman-net" }
omdurman-rules = { path = "../omdurman-rules" }
bevy = { workspace = true }
bevy_egui = { workspace = true }
bevy_matchbox = { workspace = true }
chrono = { workspace = true }
avian3d = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = "1"
ron = { workspace = true }
image = { workspace = true }
strum = { workspace = true }
bevy-color-palettes = { workspace = true }
uuid = "1"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2" }
js-sys = { version = "0.3" }
web-sys = { version = "0.3", features = ["Window", "Location", "Blob", "Url", "HtmlAnchorElement", "Document"] }
