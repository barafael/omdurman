[package]
name = "omdurman-app"
description = "Bevy frontend — rendering, editor tools, camera, dice physics, networking glue"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omdurman"
path = "src/main.rs"

[dependencies]
omdurman-types = { path = "../omdurman-types" }
omdurman-hex = { path = "../omdurman-hex" }
omdurman-map = { path = "../omdurman-map" }
omdurman-net = { path = "../omdurman-net" }
bevy = { workspace = true }
bevy_egui = { workspace = true }
bevy_matchbox = { workspace = true }
avian3d = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
image = { workspace = true }
strum = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
