[package]
name = "omdurman-app"
description = "Bevy frontend -- rendering, UI, camera, networking glue"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[[bin]]
name = "omdurman"
path = "src/main.rs"

[build-dependencies]
omdurman-types = { path = "../omdurman-types" }

[dependencies]
omdurman-types = { path = "../omdurman-types" }
omdurman-hexmap = { path = "../omdurman-hexmap" }
omdurman-board-ui = { path = "../omdurman-board-ui" }
omdurman-net = { path = "../omdurman-net" }
omdurman-rules = { path = "../omdurman-rules" }
# In-game AI commanders (Kitchener/Khalifa): legal-action enumeration +
# doctrine scoring, shared with the headless tuning CLI.
omdurman-bot = { path = "../omdurman-bot" }
bevy = { workspace = true, features = ["dynamic_linking"] }
# `picking`: ray-cast the board plane via bevy_picking's mesh backend, and let
# window egui take the picking focus over its widgets (see src/picking.rs).
bevy_egui = { workspace = true, features = ["picking"] }
bevy_matchbox = { workspace = true }
chrono = { workspace = true }
# The title-screen map's one-off blur (`splash::map`); the same 0.25 Bevy
# decodes with, so `Image::try_into_dynamic` hands us its `DynamicImage`.
image = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
ron = { workspace = true }

uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dotenvy = { workspace = true }

[dev-dependencies]
tempfile = "3"
traceability-macro = { path = "../traceability-macro" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen = { version = "0.2" }
js-sys = { version = "0.3" }
web-sys = { workspace = true, features = ["Window", "Location", "Blob", "Url", "HtmlAnchorElement", "Document", "Storage", "MediaQueryList"] }
