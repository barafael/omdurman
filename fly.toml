# fly.toml app configuration file generated for omdurman-matchbox on 2026-05-09T22:14:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omdurman-matchbox'
primary_region = 'cdg'

[build]
  image = 'ghcr.io/johanhelsing/matchbox_server:latest'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
