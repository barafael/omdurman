[workspace]
resolver = "3"
members = ["crates/rgcore", "crates/rgworker", "crates/rgapp", "crates/rgcheck"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
surrealdb = { version = "4.0.0", default-features = false, features = ["kv-mem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
thiserror = "2"
rgcore = { path = "crates/rgcore", default-features = false }

# Release builds keep LTO off so they build quickly; `--profile dist` (build.sh) is for deployment.
[profile.release]
opt-level = 3
codegen-units = 16

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
