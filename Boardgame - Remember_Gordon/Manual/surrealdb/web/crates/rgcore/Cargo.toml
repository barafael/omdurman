[package]
name = "rgcore"
description = "The archive's database core: load the corpus into in-memory SurrealDB and run read-only queries"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["engine"]
engine = ["dep:surrealdb", "dep:web-time", "dep:getrandom", "dep:thiserror"]
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
surrealdb = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
thiserror = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Response"], optional = true }
