[package]
name = "rgworker"
description = "Web Worker hosting the in-memory corpus; answers the app's queries"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rgcore = { workspace = true, features = ["engine", "web"] }
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook = "0.1"
web-sys = { workspace = true, features = ["DedicatedWorkerGlobalScope", "MessageEvent", "WorkerGlobalScope", "WorkerLocation", "console"] }
