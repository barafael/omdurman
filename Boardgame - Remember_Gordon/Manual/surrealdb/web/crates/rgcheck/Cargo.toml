[package]
name = "rgcheck"
description = "Native check of the browser dataset: load it as the worker does, seal it, run every benchmark question and the write probes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rgcore = { workspace = true, features = ["engine"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "fs"] }
