[package]
name = "map-editor"
description = "Native Bevy map editor for the Omdurman boards, unit sheet, and sprite annotations"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "map-editor"
path = "src/main.rs"

[dependencies]
omdurman-types = { path = "../../omdurman-types" }
omdurman-rules = { path = "../../omdurman-rules" }
omdurman-hexmap = { path = "../../omdurman-hexmap" }
bevy = { workspace = true }
bevy_egui = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
# Full default codecs: the editor loads/saves arbitrary scan rasters.
image = { workspace = true, default-features = true }
strum = { workspace = true }
