[package]
name = "asset-editor"
description = "eframe/egui editor for the six rules-data RON tables, with undo/redo and engine cross-checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "asset-editor"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
env_logger = "0.11"
image = { workspace = true, default-features = false, features = ["webp", "jpeg", "png"] }
indexmap = { workspace = true }
log = "0.4"
ron = { workspace = true }
serde = { workspace = true }
omdurman-rules = { path = "../../omdurman-rules" }
omdurman-types = { path = "../../omdurman-types" }
