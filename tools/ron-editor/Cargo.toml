[package]
name = "ron-editor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ron-editor"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["webp"] }
indexmap = { version = "2", features = ["serde"] }
ron = "0.8"
serde = { version = "1", features = ["derive"] }
omdurman-rules = { path = "../../omdurman-rules" }
omdurman-types = { path = "../../omdurman-types" }
