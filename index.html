<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remember Gordon! Battle of Omdurman</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #111;
      overflow: hidden;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <link data-trunk rel="rust" href="omdurman-app/Cargo.toml" data-bin="omdurman"/>
  <link data-trunk rel="copy-dir" href="omdurman-app/assets"/>
  <script>
    window.addEventListener('beforeunload', function() {
      document.querySelectorAll('canvas').forEach(function(c) { c.remove(); });
    });
    new MutationObserver(function() {
      var c = document.querySelector('canvas');
      if (c && !c.dataset.glh) {
        c.dataset.glh = '1';
        c.addEventListener('webglcontextlost', function(e) {
          e.preventDefault();
          console.warn('WebGL context lost');
          setTimeout(function() { location.reload(); }, 200);
        });
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
