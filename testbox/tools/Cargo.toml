[package]
name = "testbox-tools"
description = "The testbox's own programs: `with-display`, the peers' entrypoint."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# A workspace of its own, out of omdurman's: the peer image builds it without the game's
# dependencies.
[workspace]

[dependencies]
# `with-display` hands the stop signals on to the game it runs.
signal-hook = "0.3"
libc = "0.2"
