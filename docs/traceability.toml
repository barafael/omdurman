# docs/traceability.toml
#
# The rulebook index: one [[mapping]] per section of the OCR manual, naming
# the code that implements it, the tests and proofs that exercise it, and --
# for implemented sections -- the manual's rule its code enforces (`clause`)
# and the one test or proof whose job that rule is (`witness`). Enforced by
# `cargo test -p omdurman-rules --test traceability` (checks in
# tools/traceability-lsp/src/checks.rs, shared with the editor LSP):
#
#   1. "implemented" mappings have [[mapping.impl]] sites (`file`, `symbol`)
#      whose symbol occurs in the file's code (comments do not count); other
#      statuses have none. There are no line numbers: the report finds each
#      symbol's definition when it is built.
#   2. "implemented" mappings quote their `clause` verbatim from the manual
#      section's text (pseudo-sections such as §CRT excepted) and name a
#      `witness` listed in their `tests` or `proofs`; only implemented
#      sections carry a clause, witness or `approximation`.
#   3. Every `§N` citation in Rust source names a mapped section, every
#      mapping section exists in the manual, and every manual section has a
#      mapping (containers are "descriptive").
#   4. Every cited symbol is anchored in
#      `omdurman-rules/tests/traceability_paths.rs`, which the compiler checks
#      -- a rename breaks the build -- and every anchor there is cited here.
#   5. `tests = [...]` / `proofs = [...]` are bijective with the
#      `#[rulebook("§N")]` attributes in source (the only annotation that
#      counts; a `§` in a comment is a citation, never coverage), and every
#      implemented mapping has at least one annotated, non-ignored test.
#
# The mutation gate (CI `mutation-gate`; `cargo run -p traceability-lsp
# --bin mutation-gate`) checks the evidence behind (5): a mutant on a changed
# line of a cited engine function must fail one of the engine tests of the
# sections that cite it.
#
# `symbol` is the Rust item the entry maps to; qualify methods, variants and
# fields with their owning type for readability (e.g.
# "UnitKind::may_melee_attack") -- the checks match the trailing identifier.
#
# Status meanings:
#   "implemented" -- code exists, is test-covered and has a clause + witness
#   "descriptive" -- narrative/historical or pure container heading; no rule
#                    to enforce (must not carry impls or tests)
#   "implicit"    -- real game convention not codified in the rules engine
#   "out-of-scope"-- physical component, setup instruction, scenario data,
#                    or printed-table reference not transcribed
#
# Optional fields:
#   approximation = "..." -- where the implementation deliberately departs
#                            from the clause, and why (shown in the report)
#   note = "..."          -- other caveats (not shown in the report)
#   page = "N"            -- printed manual page number (e.g. "1" or "5-6")

