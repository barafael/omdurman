# docs/traceability.toml
#
# Bijective rulebook <-> implementation traceability matrix.
#
# Every rulebook section with game-mechanical impact has a [[mapping]] entry.
# Every `§` citation in the Rust source must appear in at least one entry.
#
# `symbol` in [[mapping.impl]] is the Rust item the entry maps to. For
# method/variant/field names you may qualify it with the owning type (e.g.
# "UnitKind::may_melee_attack") for clarity; the line-accuracy check matches on
# the trailing identifier ("may_melee_attack"). Every cited symbol must also be
# referenced in `omdurman-rules/tests/traceability_paths.rs`, which proves at
# COMPILE TIME that the item still exists -- so a rename/removal breaks the
# build, not just a string search. After moving code, re-sync the `line` fields
# with:  cargo run -p traceability-typst --bin fix_lines
#
# Status meanings:
#   "implemented" -- code exists; [[mapping.impl]] entries list file:symbol
#   "descriptive" -- narrative/historical only, no rule to enforce
#   "implicit"    -- real game convention not codified in the rules engine
#   "out-of-scope"-- physical component, setup instruction, scenario data,
#                   or printed-table reference not transcribed
#
# Optional field (add manually per section):
#   page = "N"     -- original printed manual page number (e.g. "1" or "5-6")

