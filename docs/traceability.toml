section = "§5.44"
title = "ZOC limitations (walls, khor, fort, Nile, Zariba)"
status = "implemented"
note = "Implemented in GameState::zoc_extends: ZOCs do not cross a khor, do not extend into or out of a Nile hex (gunboat-vs-gunboat exception preserved), and do not extend into a fort, though they extend out of one even unoccupied. They cross a wall only from a walled-city hex outward, a gate only outward, and a breach both ways, and they extend out of but not into a hut or building hex. NOT implemented: the Zariba's 'out of, but not into' clause -- Zariba hexsides block ZOC in both directions (HexsideKind::blocks_zoc)."
