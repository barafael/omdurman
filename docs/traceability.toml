# docs/traceability.toml
#
# Bijective rulebook <-> implementation traceability matrix, enforced by
# `cargo test -p omdurman-rules --test traceability` (checks live in
# tools/traceability-lsp/src/checks.rs, shared with the editor LSP):
#
#   1. "implemented" mappings have [[mapping.impl]] sites whose symbol really
#      exists near the cited `line` (code only -- a comment mention does not
#      count); other statuses have no impls.
#   2. Every `§N` citation in Rust source has a [[mapping]] entry.
#   3. Every (non-pseudo) mapping section exists in the OCR manual ...
#   4. ... and every cited symbol is referenced in
#      `omdurman-rules/tests/traceability_paths.rs`, which proves at COMPILE
#      TIME that the item still exists -- a rename/removal breaks the build,
#      not just a string search.
#   5. ... every manual section has a [[mapping]] entry (containers are
#      "descriptive") -- the manual -> matrix direction of the bijection.
#   6. ... every anchor in traceability_paths.rs is cited by the matrix --
#      the paths -> matrix direction, so the two files cannot drift apart.
#
# Coverage is a hard requirement: every "implemented" mapping must list at
# least one test in `tests = [...]` (use the fully qualified test name
# `crate::module::fn_name` as reported by the scanner). The listed test must
# carry a `#[rulebook("§N")]` (or `// §N`) annotation for that section and
# must not be `#[ignore]`d -- see the `implemented_mappings_are_tested` test.
#
# `symbol` in [[mapping.impl]] is the Rust item the entry maps to. For
# method/variant/field names you may qualify it with the owning type (e.g.
# "UnitKind::may_melee_attack") for clarity; the line-accuracy check matches on
# the trailing identifier ("may_melee_attack"). After moving code, re-sync the
# `line` fields with:  cargo run -p traceability-typst --bin fix_lines
#
# Status meanings:
#   "implemented" -- code exists and is test-covered; [[mapping.impl]] lists
#                    file:symbol sites
#   "descriptive" -- narrative/historical or pure container heading; no rule
#                    to enforce (must not carry impls or tests)
#   "implicit"    -- real game convention not codified in the rules engine
#   "out-of-scope"-- physical component, setup instruction, scenario data,
#                    or printed-table reference not transcribed
#
# Optional field (add manually per section):
#   page = "N"     -- original printed manual page number (e.g. "1" or "5-6")

