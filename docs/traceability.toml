[[mapping]]
section = "§9.346"
title = "GORDON immobile, eliminated only at the Palace (Bonus)"
status = "implemented"
note = "Implemented: Gordon is immobile, auto-placed in the palace, and eliminated by Dervish occupation/pass-through of the palace (normal move, advance after combat, or overrun), which records the turn and ends the game. Every other elimination path (fire/melee CRT, §6.51(b) orphaned leader) runs through the shared eliminate_unit, which likewise records the turn, so the game ends whenever GORDON falls. The printed 'only by a Dervish unit passing through or occupying the palace hex' exclusivity is approximated: a CRT death is treated as his fall (the Dervish advance into the palace would follow anyway)."
tests = [
    "omdurman-rules::src::effects::tests::breach_casualty_stands_at_the_wall","omdurman-rules::src::unit_profiles::gordon_is_an_immobile_british_leader", "omdurman-rules::src::effects::tests::gordon_survives_means_no_elimination", "omdurman-rules::src::effects::tests::gordon_dying_in_melee_ends_fall_of_khartoum", "omdurman-rules::src::effects::tests::fire_never_kills_gordon", "omdurman-rules::src::effects::tests::a_lone_gordon_makes_no_melee_roll", "omdurman-app::src::scenario_setup::fall_of_khartoum_places_gordon_in_the_palace"]

