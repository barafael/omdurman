[[mapping]]
section = "§5.21"
title = "Friendlies transport via gunboat"
status = "implemented"
clause = "The transport is accomplished in the following sequence: a) on any turn that a \"Friendlies\" unit and any Anglo-Egyptian gunboat start their turn adjacent, that unit may load onto (i.e. stack with) the gunboat; b) during the Anglo-Egyptian player's next turn the gunboat may move to any Nile hex adjacent to a west bank hex (up to the gunboat's movement allowance); c) on the Anglo-Egyptian player's third turn the \"Friendlies\" unit may disembark and move normally, paying the normal terrain cost for the first hex entered."
witness = "omdurman-rules::src::effects::tests::friendlies_cross_the_nile_over_three_turns"
approximation = "Only one Friendlies transport mission may be in progress at a time, a design choice where the manual is silent, so a second Friendlies unit cannot load while another is aboard or in transit."
note = "Implemented: Load (Anglo-Egyptian Movement phase, Isa Zachneih eliminated, a Friendlies unit and a gunboat that start their turn adjacent -- neither has moved -- the gunboat otherwise alone) puts the unit aboard, on the gunboat's hex; the gunboat carries it as it moves from the next turn (not the load turn); Disembark from turn N+2 onto an adjacent west-bank land hex, paying its terrain cost, after which the unit moves normally. One mission at a time (design choice; the manual is silent). The UI offers exactly can_friendlies_transport's legal actions (friendlies_transport_offers)."
tests = [
    "omdurman-rules::src::effects::tests::a_mined_gunboat_scores_and_takes_its_friendlies_down",
    "omdurman-rules::src::effects::tests::friendlies_transport_offer_load_requires_prerequisites",
    "omdurman-rules::src::effects::tests::friendlies_cross_the_nile_over_three_turns",
]

