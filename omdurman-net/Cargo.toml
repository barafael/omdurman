[package]
name = "omdurman-net"
description = "P2P networking plumbing: wire protocol, resources, socket setup via matchbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[dependencies]
bevy = { workspace = true }
bevy_matchbox = { workspace = true }
matchbox_socket = { git = "https://github.com/barafael/matchbox.git" }
omdurman-types = { path = "../omdurman-types" }
omdurman-rules = { path = "../omdurman-rules" }
serde = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }
petname = { version = "3", default-features = false, features = ["default-rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# reqwest + rustls do not build for wasm32; the LLM HTTP transport is
# native-only (the app's flavour-text systems and the bot both run there).
# `request_completion` is stubbed on wasm.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
matchbox_signaling = { git = "https://github.com/barafael/matchbox.git" }
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams", "History"] }
