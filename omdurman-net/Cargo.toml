[package]
name = "omdurman-net"
description = "P2P networking plumbing: wire protocol, resources, socket setup via matchbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[dependencies]
bevy = { workspace = true }
bevy_matchbox = { workspace = true }
matchbox_socket = { workspace = true }
omdurman-types = { path = "../omdurman-types" }
omdurman-rules = { path = "../omdurman-rules" }
serde = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }
petname = { workspace = true }

[dev-dependencies]
traceability-macro = { path = "../traceability-macro" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
matchbox_signaling = { workspace = true }
futures = { workspace = true }
test-case = "3.3.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
web-sys = { workspace = true, features = ["Window", "Location", "History"] }
