[package]
name = "omdurman-net"
description = "P2P networking plumbing: wire protocol, resources, socket setup via matchbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[dependencies]
bevy = { workspace = true }
bevy_matchbox = { workspace = true }
matchbox_socket = { workspace = true }
omdurman-types = { path = "../omdurman-types" }
omdurman-rules = { path = "../omdurman-rules" }
serde = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
strum = { workspace = true }
petname = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# reqwest + rustls do not build for wasm32; the LLM HTTP transport is
# native-only (the app's flavour-text systems and the bot both run there).
# `request_completion` is stubbed on wasm.
# `rustls-no-provider` (not `rustls`): reqwest's `rustls` feature enables
# rustls's aws-lc-rs, and matchbox/webrtc/dtls enables rustls's ring. With
# BOTH providers present rustls 0.23 refuses to auto-pick a process-wide
# CryptoProvider and panics at runtime ("Could not automatically determine
# the process-level CryptoProvider"), killing the WebRTC DTLS handshake —
# root cause of the matchbox_integration timeout. Staying provider-less here
# leaves ring as the single provider, which rustls auto-selects.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Only to install ring as the process-wide rustls provider before reqwest
# builds a Client (see the comment above). Feature-set matches what
# matchbox/dtls already unifies into the graph — no second provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# reqwest's hyper-util DNS needs a Tokio reactor; Bevy's IoTaskPool has none,
# so the blocking transport drives the request on its own runtime.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
matchbox_signaling = { workspace = true }
futures = { workspace = true }
test-case = "3.3.1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams", "History"] }
