[package]
name = "omdurman-net"
description = "P2P networking plumbing: wire protocol, resources, socket setup via matchbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy = { workspace = true }
bevy_matchbox = { workspace = true }
matchbox_socket = "0.14"
omdurman-types = { path = "../omdurman-types" }
omdurman-rules = { path = "../omdurman-rules" }
serde = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
chrono = { workspace = true }
ron = { workspace = true }
strum = { workspace = true }
petname = { version = "3", default-features = false, features = ["default-rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams", "History"] }
