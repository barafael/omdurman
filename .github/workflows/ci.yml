name: CI

# Runs fmt, clippy and the workspace test suite (Linux, macOS, Windows) and the
# traceability matrix check on every push/PR. Deployment to GitHub Pages is
# handled by deploy.yml; this workflow is the verification gate.
#
# The Kani proofs run only on manual dispatch (see the `kani` job), on Linux:
# Kani has no native Windows support. The traceability matrix check is part of
# the test suite (`--test traceability`), so a doc<->code mismatch fails here
# too.
#
# NOTE: the traceability job compiles `omdurman-hexmap` (a Bevy crate, pulled
# in by the §-anchored `traceability_paths` compile check), so it needs the
# Bevy Linux system packages just like the test matrix.
#
# Diagnostics: failing steps tee their output to a file and a follow-up step
# re-emits the interesting lines as `::error::` annotations, so the failure
# reason is visible in the public checks API without downloading logs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Slimmer dev builds: ubuntu runners have ~14 GB disk / 7 GB RAM, and a
      # full bevy workspace with debug info blows through both.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUST_BACKTRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # The repo's canonical line endings are LF, and several tests assert
      # byte-identical round trips over committed text files (asset-editor
      # tables, splash's embedded text). Windows
      # runners default to core.autocrlf=true, which would CRLF-convert the
      # checkout and fail all of them.
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Bevy Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-cursor-dev libxi-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee ci_clippy.log

      - name: Clippy failure details
        if: failure()
        shell: bash
        run: |
          grep -nE "^error" ci_clippy.log | head -30
          grep -nE "^error" ci_clippy.log | head -9 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

      - name: Run workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee ci_test.log

      - name: Test failure details
        if: failure()
        shell: bash
        run: |
          grep -E "panicked at|^failures:$|test result: FAILED|^error\[|---- .* stdout ----" ci_test.log | head -40
          grep -E "panicked at|test result: FAILED|^error\[" ci_test.log | head -9 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    # Gated to manual dispatch: GitHub runners kept killing the job with a
    # shutdown signal (exit 143, "runner service stopped / run canceled")
    # mid-suite -- four consecutive runs, every harness green each time and
    # no proof ever failing. The suite is verified locally via
    # `scripts/kani.sh` (see docs/architecture.md §9); workflow_dispatch
    # keeps the cached on-demand CI run available.
    if: github.event_name == 'workflow_dispatch'
    env:
      CARGO_INCREMENTAL: "0"
      # A workspace-local target dir (instead of the script's /tmp default)
      # so the proof build artifacts are cacheable between runs.
      KANI_TARGET_DIR: ${{ github.workspace }}/kani-target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cargo kani setup` downloads a full bundled Rust toolchain into
      # ~/.kani on every run (~8 min); cache it per pinned Kani version.
      - name: Cache Kani setup
        uses: actions/cache@v4
        with:
          path: ~/.kani
          key: ubuntu-kani-0.67.0

      # The Kani proof build recompiles both crates from scratch on every
      # run (~cold-compile cost measured in docs/architecture.md §9); cache
      # it per pinned Kani version + lockfile.
      - name: Cache Kani proof build
        uses: actions/cache@v4
        with:
          path: kani-target
          key: ubuntu-kani-target-0.67.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-kani-target-0.67.0-

      # Installed manually instead of via model-checking/kani-github-action:
      # the action's default `command: cargo-kani` verifies the WHOLE
      # workspace with no package selection, and some workspace dependency's
      # MSRV exceeds the Rust nightly bundled with Kani — the targeted
      # `scripts/kani.sh -p` runs are the supported invocation.
      - name: Install Kani
        shell: bash
        run: |
          set -euxo pipefail
          cargo install --locked kani-verifier --version 0.67.0 2>&1 | tee kani_install.log
          cargo kani setup 2>&1 | tee kani_setup.log

      - name: Install failure details
        if: failure()
        shell: bash
        run: |
          { cat kani_install.log 2>/dev/null; cat kani_setup.log 2>/dev/null; } \
            | grep -nE "error|failed|denied|warning: unable" | head -30
          { cat kani_install.log 2>/dev/null; cat kani_setup.log 2>/dev/null; } \
            | grep -nE "error|failed" | head -9 | while IFS= read -r line; do
                echo "::error::${line:0:300}"
              done

      - name: Run Kani proofs
        shell: bash
        env:
          # ubuntu-latest provides 4 vCPUs; verify harnesses in parallel.
          KANI_JOBS: "4"
        run: |
          set -o pipefail
          ./scripts/kani.sh -p omdurman-types -p omdurman-rules 2>&1 | tee kani_proofs.log

      - name: Proof failure details
        if: failure()
        shell: bash
        run: |
          grep -nE "FAILED|FAILURE|error" kani_proofs.log | head -40
          grep -nE "FAILED|FAILURE" kani_proofs.log | head -9 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

  traceability:
    name: Traceability matrix
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `traceability_paths` compile-checks symbols that live in Bevy crates
      # (omdurman-hexmap is a dev-dependency of omdurman-rules), so the Bevy
      # Linux system packages are needed here too.
      - name: Install Bevy Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-cursor-dev libxi-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-traceability-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-traceability-

      - name: Traceability matrix + paths
        shell: bash
        run: |
          set -o pipefail
          cargo test -p omdurman-rules --test traceability --test traceability_paths 2>&1 | tee ci_traceability.log

      - name: Traceability failure details
        if: failure()
        shell: bash
        run: |
          grep -nE "panicked at|test result: FAILED|^error\[|mapping|annotation|anchor" ci_traceability.log | head -40
          grep -nE "panicked at|test result: FAILED|^error\[" ci_traceability.log | head -9 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done

      # The report is not committed: build it here so every PR can download
      # the PDF it would publish (and a template error fails the PR, not the
      # Pages deploy). The deploy workflow publishes it for main.
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      - name: Traceability report
        run: |
          cargo run -p traceability-typst -- docs/traceability.toml traceability.typ tools/traceability-typst/data.json
          typst compile traceability.typ traceability.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: traceability.pdf

  # The rulebook tests must pin the code they cite: on every change, each
  # mutant cargo-mutants makes on a changed line of a function that an
  # `implemented` section of docs/traceability.toml cites must fail one of
  # the engine tests of the sections citing it
  # (tools/traceability-lsp/src/bin/mutation-gate.rs). Accepted equivalent
  # mutants go in .cargo/mutants.toml with a comment.
  mutation-gate:
    name: Mutation gate
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutation-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutation-

      - name: The change under test
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --no-ext-diff "origin/${{ github.base_ref }}...HEAD" > gate.diff
          elif ! git diff --no-ext-diff "${{ github.event.before }}" "${{ github.sha }}" > gate.diff 2>/dev/null; then
            git diff --no-ext-diff HEAD~1 HEAD > gate.diff
          fi
          echo "$(grep -c '^+++ ' gate.diff) file(s) changed"

      - name: Mutation gate
        shell: bash
        run: |
          if [ ! -s gate.diff ]; then echo "empty diff"; exit 0; fi
          cargo run -p traceability-lsp --bin mutation-gate -- --in-diff gate.diff --in-place

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-gate
          path: target/mutation-gate
