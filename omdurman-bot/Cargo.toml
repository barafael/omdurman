[package]
name = "omdurman-bot"
description = "Headless AI playthrough driver for rule verification (random + LLM-advised)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omdurman-rules = { path = "../omdurman-rules" }
omdurman-types = { path = "../omdurman-types" }
omdurman-net   = { path = "../omdurman-net" }
rand           = { workspace = true }
rand_chacha    = { workspace = true }
chrono         = { workspace = true }
serde          = { workspace = true }
serde_json     = "1"
futures        = "0.3"
dotenvy        = "0.15"
# reqwest's async transport needs a Tokio reactor; the CLI provides one.
tokio          = { version = "1", features = ["rt"] }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "omdurman-bot-cli"
path = "src/main.rs"
