[package]
name = "omdurman-bot"
description = "Headless AI playthrough driver for rule verification (random, aggressive, historical commanders)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omdurman-rules = { path = "../omdurman-rules" }
omdurman-types = { path = "../omdurman-types" }
omdurman-net   = { path = "../omdurman-net" }
rand           = { workspace = true }
chrono         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "omdurman-bot-cli"
path = "src/main.rs"
